
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://docflow:docflow@db:5432/docflow
      GATEWAY_OCR_SERVICE_URL: http://ocr:8001
      GATEWAY_FACE_SERVICE_URL: http://face:8002
      GATEWAY_REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully

  # Arq worker — runs the orchestrator pipeline in a separate
  # process from the API gateway, so a gateway crash mid-pipeline
  # doesn't strand cases. Reads from the same image as the gateway,
  # different command. Scale horizontally by setting
  # `docker compose up -d --scale gateway_worker=3`.
  gateway_worker:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    command: ["arq", "app.queue.WorkerSettings"]
    env_file:
      - .env.dev
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://docflow:docflow@db:5432/docflow
      GATEWAY_OCR_SERVICE_URL: http://ocr:8001
      GATEWAY_FACE_SERVICE_URL: http://face:8002
      GATEWAY_REDIS_URL: redis://redis:6379/0
      ARQ_MAX_JOBS: "10"
    volumes:
      - uploads:/app/uploads
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ocr:
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env.dev
    environment:
      OCR_GOOGLE_CREDENTIALS_PATH: /app/credentials/google-vision.json
      OCR_MIN_CONFIDENCE_THRESHOLD: 0.7
      OCR_MOCK_MODE: ${OCR_MOCK_MODE:-false}
    volumes:
      - uploads:/app/uploads
      - ./credentials:/app/credentials:ro
      - ./shared:/app/shared

  face:
    build:
      context: .
      dockerfile: services/face/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env.dev
    environment:
      FACE_AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      FACE_AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      FACE_AWS_REGION: ${AWS_REGION:-us-east-1}
      FACE_MOCK_MODE: ${FACE_MOCK_MODE:-false}
    volumes:
      - uploads:/app/uploads
      - ./shared:/app/shared

  # ── Simulated Lebanese civil registry (Ministry of Interior lookup) ────────
  registry_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    volumes:
      - registry_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry"]
      interval: 5s
      timeout: 5s
      retries: 5

  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env.dev
    environment:
      REGISTRY_DATABASE_URL: postgresql+asyncpg://registry:registry@registry_db:5432/registry
    depends_on:
      registry_db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://localhost}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "3000:80"
    depends_on:
      - gateway

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
      - web

  # ── Exporters ────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://docflow:docflow@db:5432/docflow?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  # ── Monitoring ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/prometheus/drift_alerts.yml:/etc/prometheus/drift_alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - gateway
      - ocr
      - face

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: docflow
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-service-health.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Distributed tracing collector + UI. Receives OTLP gRPC on 4317
  # from each FastAPI service, renders traces at http://localhost:16686.
  # All-in-one image keeps memory tiny (~80MB) — fine for demo and
  # local dev; production would split collector / query / storage.
  # MinIO — S3-compatible object storage for uploaded documents.
  # In prod this gets swapped for real AWS S3 (or any compliant
  # object store) by changing the STORAGE_S3_* env vars in .env.dev.
  # Console UI on :9001, S3 API on :9000.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:-minioadmin12345}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot bucket creator — uses the MinIO client (mc) image to
  # provision the docflow-uploads bucket on first boot. Idempotent.
  minio_init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_S3_ACCESS_KEY:-minioadmin} ${STORAGE_S3_SECRET_KEY:-minioadmin12345};
      mc mb -p local/${STORAGE_S3_BUCKET:-docflow-uploads} || true;
      mc anonymous set none local/${STORAGE_S3_BUCKET:-docflow-uploads} || true;
      echo 'bucket ready';
      "
    restart: "no"

  # Pushgateway — short-lived jobs (continuous eval, daily sweeps)
  # push metrics here and Prometheus scrapes them. The job stays
  # visible until it's explicitly deleted, which is what we want for
  # "the eval ran X hours ago and scored Y" tracking.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "9091:9091"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"   # web UI
      - "4317:4317"     # OTLP gRPC ingest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # GlitchTip — open-source Sentry-protocol error tracking. Workers
  # share the redis instance the gateway already runs; data lives in
  # its own postgres so a botched migration on either side can't
  # corrupt the other. Browser UI on http://localhost:8005.
  glitchtip_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs Django migrations once on startup before the web/worker
  # containers come up. Without this, /login 500s with
  # 'relation "users_user" does not exist' on first boot.
  glitchtip_migrate:
    image: glitchtip/glitchtip:v4.1
    depends_on:
      glitchtip_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip_db:5432/glitchtip
      SECRET_KEY: change-me-in-prod-please
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:8005
      DEFAULT_FROM_EMAIL: noreply@docflow.lb
      REDIS_URL: redis://redis:6379/1
    command: ./manage.py migrate
    restart: "no"

  glitchtip:
    image: glitchtip/glitchtip:v4.1
    depends_on:
      glitchtip_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip_migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip_db:5432/glitchtip
      SECRET_KEY: change-me-in-prod-please
      PORT: "8005"
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:8005
      DEFAULT_FROM_EMAIL: noreply@docflow.lb
      CELERY_WORKER_AUTOSCALE: "1,2"
      REDIS_URL: redis://redis:6379/1
      ENABLE_OPEN_USER_REGISTRATION: "true"
    ports:
      - "8005:8005"
    volumes:
      - glitchtip_uploads:/code/uploads

  glitchtip_worker:
    image: glitchtip/glitchtip:v4.1
    depends_on:
      glitchtip_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip_migrate:
        condition: service_completed_successfully
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip_db:5432/glitchtip
      SECRET_KEY: change-me-in-prod-please
      PORT: "8005"
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:8005
      DEFAULT_FROM_EMAIL: noreply@docflow.lb
      REDIS_URL: redis://redis:6379/1
    volumes:
      - glitchtip_uploads:/code/uploads

volumes:
  postgres_data:
  registry_data:
  uploads:
  prometheus_data:
  grafana_data:
  glitchtip_db_data:
  glitchtip_uploads:
  minio_data:
