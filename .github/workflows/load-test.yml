name: Load Test

# Manual + nightly. Not on every PR — a 2-minute Locust run plus a
# full compose stack adds ~5min per CI; run it on develop nightly
# and on demand. Regressions surface in the SLO assertion exit code
# (see load/locustfile.py).

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'  # 03:23 UTC nightly

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      GATEWAY_JWT_SECRET: ci_jwt_secret_not_used_in_production
      GATEWAY_STRIPE_SECRET_KEY: sk_test_fake_for_ci
      GATEWAY_STRIPE_WEBHOOK_SECRET: whsec_fake_for_ci
      GATEWAY_SMTP_HOST: localhost
      GATEWAY_SMTP_PORT: "1025"
      GATEWAY_SMTP_USER: ci@example.com
      GATEWAY_SMTP_PASSWORD: fake
      GATEWAY_APP_BASE_URL: http://localhost:8000
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000
      AWS_ACCESS_KEY_ID: fake
      AWS_SECRET_ACCESS_KEY: fake
      AWS_REGION: us-east-1
      OCR_MOCK_MODE: "true"
      FACE_MOCK_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locust + seed deps
        run: pip install locust==2.32.4 requests

      - name: Write .env.dev
        run: |
          cat > .env.dev <<EOF
          GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET}
          GATEWAY_STRIPE_SECRET_KEY=${GATEWAY_STRIPE_SECRET_KEY}
          GATEWAY_STRIPE_WEBHOOK_SECRET=${GATEWAY_STRIPE_WEBHOOK_SECRET}
          GATEWAY_SMTP_HOST=${GATEWAY_SMTP_HOST}
          GATEWAY_SMTP_PORT=${GATEWAY_SMTP_PORT}
          GATEWAY_SMTP_USER=${GATEWAY_SMTP_USER}
          GATEWAY_SMTP_PASSWORD=${GATEWAY_SMTP_PASSWORD}
          GATEWAY_APP_BASE_URL=${GATEWAY_APP_BASE_URL}
          GATEWAY_CORS_ALLOWED_ORIGINS=${GATEWAY_CORS_ALLOWED_ORIGINS}
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_REGION=${AWS_REGION}
          OCR_MOCK_MODE=${OCR_MOCK_MODE}
          FACE_MOCK_MODE=${FACE_MOCK_MODE}
          EOF

      - name: Bring up backend stack
        run: |
          docker compose --env-file .env.dev up -d --build \
            db redis registry_db gateway ocr face registry

      - name: Wait for gateway
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health/ready > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs --tail=200
          exit 1

      - name: Seed load-test users
        run: python load/seed_users.py --base http://localhost:8000 --count 20

      - name: Run locust baseline
        run: |
          locust -f load/locustfile.py --host=http://localhost:8000 \
                 --headless -u 50 -r 5 -t 2m \
                 --csv=load/baseline --csv-full-history --only-summary

      - name: Upload locust artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-baseline
          path: load/baseline*.csv
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.dev down -v
