name: Build and Deploy

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # don't cancel an in-flight rollout

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write
  # Cosign keyless signing publishes a signature to the Sigstore
  # transparency log via Fulcio; that exchange uses the workflow's
  # OIDC token, hence id-token: write. attestations: write lets
  # docker/build-push-action attach an SBOM + SLSA provenance
  # attestation to the pushed image manifest.
  id-token: write
  attestations: write
  # github/codeql-action/upload-sarif (Trivy SARIF results) needs two
  # scopes:
  #   - security-events:write to publish findings to the Security tab
  #   - actions:read so its telemetry can GET the workflow run
  # Without actions:read, the SARIF upload fails with "Resource not
  # accessible by integration — workflow-runs#get-a-workflow-run"
  # even when security-events:write is granted.
  security-events: write
  actions: read

jobs:
  # ── Build and push every image to GHCR, tagged by git SHA + branch ───────
  build:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, ocr, face, registry, web]
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repo owner
        id: lcowner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lcowner.outputs.owner }}/docflow-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.lcowner.outputs.owner }}/docflow-${{ matrix.service }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + SLSA provenance attestations are attached to the
          # image manifest in GHCR. `mode=max` makes the provenance
          # include build-time materials (frontend lockfiles, base
          # image digests, etc.), which is what SLSA Level 3 expects.
          sbom: true
          provenance: mode=max
          # Bake the public API URL into the web SPA at build time. If
          # DOCFLOW_DOMAIN isn't set, fall back to a same-origin call
          # (empty VITE_API_URL → SPA hits relative /api/v1/...) so the
          # build succeeds without leaking a malformed `https://` URL
          # into the bundle.
          build-args: |
            VITE_API_URL=${{ matrix.service == 'web' && vars.DOCFLOW_DOMAIN != '' && format('https://{0}', vars.DOCFLOW_DOMAIN) || '' }}

      # Sigstore keyless signing — no long-lived keys to rotate. The
      # workflow's OIDC token identifies *this exact workflow run* to
      # Fulcio, which mints a short-lived cert; cosign signs the image
      # digest with it and publishes the signature to Rekor. Verifiers
      # can prove an image came from this repo's deploy workflow on
      # the recorded ref by checking the cert subject.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      # Sigstore's public Rekor/Fulcio occasionally returns
      # `stream error: stream ID 1; INTERNAL_ERROR` under load — it's
      # the public-good service flaking, not a config issue. Retry 3x
      # with backoff, then continue-on-error so a Sigstore outage
      # doesn't block the deploy. The image is already pushed to GHCR
      # at this point; signing is supply-chain hardening, not a gate.
      - name: Sign image with cosign (keyless)
        continue-on-error: true
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.lcowner.outputs.owner }}/docflow-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMAGE}@${DIGEST}"; then
              echo "cosign sign succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "cosign sign failed on attempt ${attempt}, retrying after $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::warning::cosign sign failed after 3 attempts — image is pushed but unsigned this run"
          exit 1

      # Syft generates an SPDX SBOM that we attach as a workflow
      # artifact and as a cosign attestation on the image. The
      # attestation lets downstream consumers (e.g. admission
      # controllers) verify the SBOM's authorship the same way they
      # verify the signature.
      - name: Generate SBOM (syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.lcowner.outputs.owner }}/docflow-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      # Same Sigstore-flake guard as the sign step above. Both calls
      # hit the same Rekor instance so they share the same outage
      # mode; both are continue-on-error.
      - name: Attest SBOM via cosign
        continue-on-error: true
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.lcowner.outputs.owner }}/docflow-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if cosign attest --yes \
                --predicate sbom-${{ matrix.service }}.spdx.json \
                --type spdxjson \
                "${IMAGE}@${DIGEST}"; then
              echo "cosign attest succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "cosign attest failed on attempt ${attempt}, retrying after $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::warning::cosign attest failed after 3 attempts — SBOM still uploaded as workflow artifact"
          exit 1

      # Trivy scan against the just-pushed image. Results uploaded to
      # the Security tab via SARIF so vulnerabilities are visible
      # without blocking the build. The CVE database refreshes
      # constantly and a freshly-published HIGH against the base image
      # would otherwise block every deploy until the upstream image
      # ships a patched tag — which can be days. We accept the
      # detect-not-block tradeoff and rely on the security tab + a
      # weekly review cadence instead.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.lcowner.outputs.owner }}/docflow-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # SARIF upload to the Security tab is best-effort. It will fail
      # silently if Code Scanning is disabled in the repo (Settings →
      # Code security → Code scanning) or if the run is a fork PR
      # with reduced token perms. Either way we don't want it to fail
      # the deploy — the SARIF file is also uploaded as a regular
      # workflow artifact below so findings remain accessible from the
      # run summary even when the Security tab path is unavailable.
      - name: Upload Trivy SARIF (Security tab, best-effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Upload Trivy SARIF (workflow artifact, always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-sarif
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 30

  # ── Deploy to the cluster (only on develop / main) ───────────────────────
  deploy:
    name: Deploy to cluster
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl + kustomize
        run: |
          curl -LO https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client

      - name: Substitute domain into prod overlay
        working-directory: k8s/overlays/prod
        env:
          DOMAIN: ${{ vars.DOCFLOW_DOMAIN }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "DOCFLOW_DOMAIN repository variable is not set"
            exit 1
          fi
          sed -i "s/DOMAIN_PLACEHOLDER/${DOMAIN}/g" kustomization.yaml

      - name: Pin image tags to this SHA
        working-directory: k8s/overlays/prod
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in gateway ocr face registry web; do
            kustomize edit set image \
              "ghcr.io/${OWNER}/docflow-${svc}=ghcr.io/${OWNER}/docflow-${svc}:${{ github.sha }}"
          done

      - name: Ensure namespace + secrets exist
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          # secrets are applied manually once per cluster (see k8s/README.md).
          # Warn if they're missing so the Deployment can't roll without them.
          kubectl -n docflow get secret docflow-secrets        > /dev/null 2>&1 || echo "::warning::docflow-secrets missing — apply k8s/secrets.yaml manually"
          kubectl -n docflow get secret docflow-google-vision  > /dev/null 2>&1 || echo "::warning::docflow-google-vision missing — create it manually (see k8s/README.md)"

      - name: Kustomize + apply
        run: |
          kustomize build k8s/overlays/prod | kubectl apply -f -

      - name: Wait for rollout
        run: |
          for svc in gateway ocr face registry web; do
            kubectl -n docflow rollout status deployment/$svc --timeout=180s
          done
