# Production overlay — Hetzner VPS with k3s.
# Real AWS / Google / Stripe credentials live in a Secret the user
# creates manually from k8s/secrets.yaml (see k8s/README.md).
#
# Edit DOMAIN_PLACEHOLDER below to your actual domain, or CI will
# substitute it from the DOCFLOW_DOMAIN repo variable at deploy time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: docflow

resources:
  - ../../base
  # HA Postgres via CloudNativePG. Operator install is one-time
  # and lives outside this kustomize tree (see k8s/operators/cnpg).
  - postgres-ha/docflow-cluster.yaml
  - postgres-ha/registry-cluster.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: docflow-config
    behavior: merge
    literals:
      - OCR_MOCK_MODE=false
      - FACE_MOCK_MODE=false
      - GATEWAY_APP_BASE_URL=https://DOMAIN_PLACEHOLDER
      - GATEWAY_FRONTEND_BASE_URL=https://DOMAIN_PLACEHOLDER
      - GATEWAY_CORS_ALLOWED_ORIGINS=https://DOMAIN_PLACEHOLDER

# Image tags are rewritten by CI (kustomize edit set image) to the
# git-sha-tagged images pushed to GHCR on the current build.
images:
  - name: ghcr.io/mohamed-moslemani/docflow-gateway
    newTag: latest
  - name: ghcr.io/mohamed-moslemani/docflow-ocr
    newTag: latest
  - name: ghcr.io/mohamed-moslemani/docflow-face
    newTag: latest
  - name: ghcr.io/mohamed-moslemani/docflow-registry
    newTag: latest
  - name: ghcr.io/mohamed-moslemani/docflow-web
    newTag: latest

patches:
  # Ingress host + TLS secret name
  - target: { kind: Ingress, name: docflow }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: DOMAIN_PLACEHOLDER
      - op: replace
        path: /spec/rules/0/host
        value: DOMAIN_PLACEHOLDER

  # cert-manager email for Let's Encrypt notifications
  - target: { kind: ClusterIssuer, name: letsencrypt-prod }
    patch: |-
      - op: replace
        path: /spec/acme/email
        value: moslemanomohamed@gmail.com

  # ── HA Postgres swap-out ────────────────────────────────────────
  # Delete the single-replica StatefulSets from the base; CNPG
  # Clusters in postgres-ha/ replace them. The base headless
  # Services `postgres` + `registry-postgres` are rewritten to
  # ExternalName so they resolve to the CNPG `-rw` services
  # (`postgres-rw`, `registry-postgres-rw`) the operator creates.
  # Gateway/registry DATABASE_URLs stay identical (`postgres:5432`,
  # `registry-postgres:5432`); behind that name is now a 3-instance
  # HA cluster with WAL archiving instead of a single pod.
  - target: { kind: StatefulSet, name: postgres }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - target: { kind: StatefulSet, name: registry-postgres }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: registry-postgres
  - target: { kind: Service, name: postgres }
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
      spec:
        $patch: replace
        type: ExternalName
        externalName: postgres-rw.docflow.svc.cluster.local
        ports:
          - name: pg
            port: 5432
            targetPort: 5432
  - target: { kind: Service, name: registry-postgres }
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: registry-postgres
      spec:
        $patch: replace
        type: ExternalName
        externalName: registry-postgres-rw.docflow.svc.cluster.local
        ports:
          - name: pg
            port: 5432
            targetPort: 5432
