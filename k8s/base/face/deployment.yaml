apiVersion: apps/v1
kind: Deployment
metadata:
  name: face
  namespace: docflow
  labels: { app: face }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: face }
  template:
    metadata:
      labels: { app: face }
    spec:
      containers:
        - name: face
          image: ghcr.io/mohamed-moslemani/docflow-face:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            # Map shared AWS creds from the Secret into the FACE_* names
            # the face service reads.
            - name: FACE_AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: docflow-secrets, key: AWS_ACCESS_KEY_ID }
            - name: FACE_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: docflow-secrets, key: AWS_SECRET_ACCESS_KEY }
          envFrom:
            - configMapRef: { name: docflow-config }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
              readOnly: true
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi"   }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: docflow-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: face
  namespace: docflow
  labels: { app: face }
spec:
  selector: { app: face }
  ports:
    - name: http
      port: 8002
      targetPort: http
