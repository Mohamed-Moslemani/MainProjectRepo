apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: docflow
  labels: { app: web }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          # VITE_API_URL is baked in at build time per environment. The
          # prod overlay points this at the image tagged with the right
          # VITE_API_URL= build arg.
          image: ghcr.io/mohamed-moslemani/docflow-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: "20m",  memory: "32Mi"  }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: docflow
  labels: { app: web }
spec:
  selector: { app: web }
  ports:
    - name: http
      port: 80
      targetPort: http
