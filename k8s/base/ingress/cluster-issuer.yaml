# cert-manager ClusterIssuer for Let's Encrypt (production endpoint).
#
# Requires cert-manager to be installed cluster-wide beforehand:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.3/cert-manager.yaml
#
# The overlays/prod/cluster-issuer-patch.yaml supplies your real email.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Overlays patch this:
    email: replace-me@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
