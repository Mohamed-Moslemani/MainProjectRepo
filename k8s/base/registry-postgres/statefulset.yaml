apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry-postgres
  namespace: docflow
  labels: { app: registry-postgres }
spec:
  serviceName: registry-postgres
  replicas: 1
  selector:
    matchLabels: { app: registry-postgres }
  template:
    metadata:
      labels: { app: registry-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: registry
            - name: POSTGRES_PASSWORD
              value: registry
            - name: POSTGRES_DB
              value: registry
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "registry"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "registry"] }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: registry-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
