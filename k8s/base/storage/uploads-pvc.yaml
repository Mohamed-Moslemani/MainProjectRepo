# Shared "uploads" volume — gateway writes document files here, OCR and
# face services read them via the same filesystem path.
#
# On single-node k3s we use a hostPath PersistentVolume. All three
# services end up on the same node, so ReadWriteMany semantics aren't
# actually enforced by the storage driver — they work because
# hostPath is just a shared directory on disk.
#
# NOTE: for multi-node prod, replace this with an S3-compatible
# object store (MinIO in-cluster, or an external S3) and refactor the
# services to upload/download via HTTP. Tracked for the real prod
# push; single-node demo can ship as-is.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: docflow-uploads
  labels:
    app.kubernetes.io/name: docflow-uploads
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-hostpath
  hostPath:
    path: /mnt/docflow-uploads
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docflow-uploads
  namespace: docflow
spec:
  accessModes: [ReadWriteMany]
  storageClassName: manual-hostpath
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      app.kubernetes.io/name: docflow-uploads
