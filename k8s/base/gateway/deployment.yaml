apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: docflow
  labels: { app: gateway }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/mohamed-moslemani/docflow-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: docflow-config }
            - secretRef:    { name: docflow-secrets }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi"   }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: docflow-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: docflow
  labels: { app: gateway }
spec:
  selector: { app: gateway }
  ports:
    - name: http
      port: 8000
      targetPort: http
