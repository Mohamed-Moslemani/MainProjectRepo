apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: docflow
  labels: { app: gateway }
spec:
  # Two replicas baseline so a single drain doesn't take traffic
  # down. HPA (autoscale/hpa.yaml) ramps further on CPU / memory.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      # Run as a non-root user with seccomp; combined with the
      # container-level capabilities drop below this prevents an
      # exploit from gaining new privileges or writing arbitrary
      # binaries.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Spread replicas across nodes so a single node failure can't
      # take every pod at once.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: gateway }
      containers:
        - name: gateway
          image: ghcr.io/mohamed-moslemani/docflow-gateway:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: docflow-config }
            - secretRef:    { name: docflow-secrets }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi"   }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: docflow-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: docflow
  labels: { app: gateway }
spec:
  selector: { app: gateway }
  ports:
    - name: http
      port: 8000
      targetPort: http
