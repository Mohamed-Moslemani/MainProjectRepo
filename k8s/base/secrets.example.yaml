# Template. Copy to secrets.yaml, fill in real values, apply with:
#   kubectl apply -f k8s/secrets.yaml
# NEVER commit the filled-in version. k8s/secrets.yaml is gitignored.
#
# The Google Cloud Vision service-account JSON is a separate secret so
# it can be mounted as a file — see the bottom of this file.

apiVersion: v1
kind: Secret
metadata:
  name: docflow-secrets
  namespace: docflow
type: Opaque
stringData:
  # JWT
  GATEWAY_JWT_SECRET: "REPLACE_WITH_64_CHAR_HEX"

  # Stripe (test keys for demo; live keys for real prod)
  GATEWAY_STRIPE_SECRET_KEY: "sk_test_REPLACE"
  GATEWAY_STRIPE_WEBHOOK_SECRET: "whsec_REPLACE"

  # Gmail SMTP (app password from Gmail → Security → App passwords)
  GATEWAY_SMTP_USER: "you@example.com"
  GATEWAY_SMTP_PASSWORD: "REPLACE_APP_PASSWORD"

  # AWS for Face Rekognition + Liveness
  AWS_ACCESS_KEY_ID: "AKIA_REPLACE"
  AWS_SECRET_ACCESS_KEY: "REPLACE"

---
# Google Vision service-account JSON mounted as a file. The pod reads it
# from /app/credentials/google-vision.json (path is pinned in the
# ConfigMap's OCR_GOOGLE_CREDENTIALS_PATH).
#
# To create from your local file without writing to disk:
#   kubectl -n docflow create secret generic docflow-google-vision \
#     --from-file=google-vision.json=./credentials/google-vision.json

apiVersion: v1
kind: Secret
metadata:
  name: docflow-google-vision
  namespace: docflow
type: Opaque
stringData:
  google-vision.json: |
    {
      "type": "service_account",
      "project_id": "REPLACE"
    }
