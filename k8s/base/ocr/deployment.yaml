apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  namespace: docflow
  labels: { app: ocr }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: ocr }
  template:
    metadata:
      labels: { app: ocr }
    spec:
      containers:
        - name: ocr
          image: ghcr.io/mohamed-moslemani/docflow-ocr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef: { name: docflow-config }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
              readOnly: true
            - name: google-vision
              mountPath: /app/credentials
              readOnly: true
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi"   }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: docflow-uploads
        - name: google-vision
          secret:
            secretName: docflow-google-vision
---
apiVersion: v1
kind: Service
metadata:
  name: ocr
  namespace: docflow
  labels: { app: ocr }
spec:
  selector: { app: ocr }
  ports:
    - name: http
      port: 8001
      targetPort: http
