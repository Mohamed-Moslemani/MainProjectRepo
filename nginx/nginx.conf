# Reverse proxy fronting the entire DocFlow stack.
#
# Single TLS entry point on 443 — routes:
#   /           → web (React SPA served by the web container's internal nginx)
#   /api/*      → gateway:8000
#   /health     → gateway:8000
#   /health/ready → gateway:8000
#   /docs       → gateway:8000 (FastAPI Swagger UI)
#   /openapi.json → gateway:8000
#
# /metrics is intentionally NOT exposed externally — Prometheus scrapes
# gateway:8000 via the internal Docker network.

# HTTP → HTTPS redirect on port 80
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost docflow.local;

    # TLS
    ssl_certificate     /etc/nginx/certs/docflow.crt;
    ssl_certificate_key /etc/nginx/certs/docflow.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow uploads up to the gateway's configured max (default 10MB + overhead)
    client_max_body_size 15M;

    # ── Gateway API ────────────────────────────────────────────────────
    location ~ ^/(api|health|docs|openapi\.json|redoc) {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Long enough for the orchestrator pipeline (OCR + Face chains)
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Web SPA (catch-all) ────────────────────────────────────────────
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block /metrics from public access
    location = /metrics {
        return 404;
    }
}
