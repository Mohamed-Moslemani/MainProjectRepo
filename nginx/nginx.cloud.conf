# Cloud reverse-proxy config — fronts the public deploy at
# https://docflows.cc / https://www.docflows.cc.
#
# Route map (matches dev nginx.conf — single TLS entry point):
#   /                        → web (React SPA, internal nginx on :80)
#   /api/v1/*                → gateway:8000 (FastAPI mounts routers there)
#   /health, /health/ready   → gateway:8000
#   /docs, /redoc, /openapi.json → gateway:8000
#
# /metrics is intentionally NOT exposed — Alloy scrapes via the internal
# Docker network. /grafana, /prometheus, /jaeger are all SaaS now (Grafana
# Cloud + Sentry), so no internal admin paths to expose.
#
# Certs are mounted from the host's /etc/letsencrypt (issued by certbot
# in standalone mode, see CLOUD.md). Renewal: re-run certbot standalone
# during a planned 5-minute maintenance window, or wire up the webroot
# challenge once we have a renewal hook story.

# ── HTTP: Let's Encrypt ACME challenge + redirect everything else ────
server {
    listen 80;
    listen [::]:80;
    server_name docflows.cc www.docflows.cc;

    # ACME HTTP-01 challenge path. Certbot writes here in webroot mode.
    # Standalone-mode renewals don't use this, but leaving it here means
    # we can flip to webroot later without an nginx rebuild.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main entry point ─────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docflows.cc www.docflows.cc;

    ssl_certificate     /etc/letsencrypt/live/docflows.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docflows.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness selfie + reference doc upload — gateway clamps at 10MB,
    # leave headroom for multipart overhead.
    client_max_body_size 15M;

    # ── Gateway API ────────────────────────────────────────────────
    location ~ ^/(api|health|docs|openapi\.json|redoc) {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Web SPA (catch-all) ────────────────────────────────────────
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        return 404;
    }
}
