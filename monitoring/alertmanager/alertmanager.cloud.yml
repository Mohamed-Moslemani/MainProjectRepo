# Alertmanager configuration — cloud-managed copy.
#
# This is the version that gets POSTed to Grafana Cloud's Mimir
# Alertmanager via scripts/import_grafana_cloud_alertmanager.py.
# The on-prem alertmanager.yml stays around for local mode; this
# file diverges from it because:
#
#   - `alertmanager_sink` no longer exists in cloud mode. The
#     local-only echo webhook is removed; alerts land at the real
#     destinations instead.
#   - `routing_key_file` / `api_url_file` are replaced by
#     `routing_key` / `api_url` (inline). The importer substitutes
#     ${PAGERDUTY_ROUTING_KEY} and ${SLACK_WEBHOOK_URL} from the
#     environment at upload time, so secrets stay out of git.
#
# Routing strategy is unchanged from on-prem:
#   - severity=critical → PagerDuty
#   - severity=warning  → Slack
#   - everything else   → Slack (fallback)

global:
  resolve_timeout: 5m

route:
  receiver: warning_route
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: critical_route
      continue: true
    - matchers:
        - severity = warning
      receiver: warning_route

receivers:
  - name: critical_route
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        send_resolved: true
        severity: 'critical'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          summary: '{{ .CommonAnnotations.summary }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'

  - name: warning_route
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: '#docflow-alerts'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: |-
          *Severity:* `{{ .CommonLabels.severity }}`
          *Service:* `{{ .CommonLabels.service }}`
          *Description:* {{ .CommonAnnotations.description }}
          {{ if .CommonAnnotations.runbook_url }}*Runbook:* <{{ .CommonAnnotations.runbook_url }}>{{ end }}

inhibit_rules:
  - source_matchers:
      - severity = critical
      - alertname = ServiceDown
    target_matchers:
      - severity = warning
    equal: [service]
