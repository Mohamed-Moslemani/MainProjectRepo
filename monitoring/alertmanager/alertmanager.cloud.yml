# Alertmanager configuration — cloud-managed copy.
#
# This is the version that gets POSTed to Grafana Cloud's Mimir
# Alertmanager via scripts/import_grafana_cloud_alertmanager.py.
#
# Notification strategy: email-only via Gmail SMTP. PagerDuty is
# intentionally NOT configured — pager-style on-call paging is
# overkill for a thesis-scale deployment with no on-call rotation.
# Slack is also dropped; if we want chat alerts later, add a
# slack_configs block alongside email_configs in the receiver.
#
# DigitalOcean's outbound-SMTP block does NOT affect us here —
# Alertmanager runs inside Grafana Cloud, not on our droplet, so
# its outbound to smtp.gmail.com:587 sails through.
#
# Routing strategy: severity=critical and severity=warning both go
# to the same email receiver (most thesis-scale ops won't have a
# separate on-call vs ops channel). Tweak `routes:` below to split
# into multiple email aliases if you want that.

global:
  resolve_timeout: 5m
  # Gmail SMTP. The app password is a 16-char token from Google's
  # "App Passwords" page — works from anywhere with the right auth,
  # so Alertmanager → smtp.gmail.com:587 from Grafana Cloud's egress
  # works the same as it would from your laptop.
  smtp_smarthost: ${SMTP_SMARTHOST}
  smtp_from: ${SMTP_FROM}
  smtp_auth_username: ${SMTP_AUTH_USERNAME}
  smtp_auth_password: ${SMTP_AUTH_PASSWORD}
  # Gmail rejects plaintext on 587; require STARTTLS.
  smtp_require_tls: true

route:
  receiver: docflow_email
  group_by: ['alertname', 'service']
  # Wait 30s after the first alert in a group before sending so
  # related alerts get bundled in one email rather than spammed
  # individually.
  group_wait: 30s
  # New alerts in an existing group go out at most every 5min.
  group_interval: 5m
  # Re-send the SAME alert no more than once every 4 hours so a
  # persistent failure doesn't flood the inbox.
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: docflow_email
    - matchers:
        - severity = warning
      receiver: docflow_email

receivers:
  - name: docflow_email
    email_configs:
      - to: ${ALERT_EMAIL_TO}
        send_resolved: true
        # Inline HTML for the alert email. Subject mirrors the
        # severity for inbox triage; body lists firing + resolved
        # alerts with annotations the rules already populate.
        headers:
          Subject: '[DocFlow {{ .CommonLabels.severity | toUpper }}] {{ .CommonAnnotations.summary }}'
        html: |-
          <h2>{{ .CommonAnnotations.summary }}</h2>
          <p>
            <b>Severity:</b> {{ .CommonLabels.severity }}<br/>
            <b>Service:</b> {{ .CommonLabels.service }}<br/>
            <b>Status:</b> {{ .Status }}
          </p>
          <p>{{ .CommonAnnotations.description }}</p>
          {{ if .CommonAnnotations.runbook_url }}
          <p><a href="{{ .CommonAnnotations.runbook_url }}">Runbook</a></p>
          {{ end }}
          <hr/>
          <p>Firing: {{ .Alerts.Firing | len }} · Resolved: {{ .Alerts.Resolved | len }}</p>

inhibit_rules:
  - source_matchers:
      - severity = critical
      - alertname = ServiceDown
    target_matchers:
      - severity = warning
    equal: [service]
