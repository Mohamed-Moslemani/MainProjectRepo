# Pre-computed quantiles + rate aggregations for the AI signals.
#
# Recording rules let drift queries (which sweep the whole time
# series) run against a small materialised view rather than the raw
# histograms. Two practical wins:
#   1. Drift dashboards stay snappy — querying p50 across 30 days of
#      raw `_bucket` data is heavy; querying the recording rule is
#      one row per timestamp.
#   2. Alert evaluation gets cheaper, so we can sample at 5m without
#      cooking the Prometheus instance.
#
# All rules window over 1 hour (short enough to react, long enough
# to smooth out demo-traffic noise).

groups:
  - name: ai_signal_quantiles
    interval: 1m
    rules:
      # ───── OCR confidence ─────
      - record: docflow:ocr_confidence:p50_1h
        expr: histogram_quantile(0.50, sum by (le) (rate(docflow_ocr_confidence_bucket[1h])))
      - record: docflow:ocr_confidence:p95_1h
        expr: histogram_quantile(0.95, sum by (le) (rate(docflow_ocr_confidence_bucket[1h])))

      # ───── Face similarity ─────
      - record: docflow:face_similarity:p50_1h
        expr: histogram_quantile(0.50, sum by (le) (rate(docflow_face_similarity_score_bucket[1h])))
      - record: docflow:face_similarity:p95_1h
        expr: histogram_quantile(0.95, sum by (le) (rate(docflow_face_similarity_score_bucket[1h])))

      # ───── Liveness score ─────
      - record: docflow:liveness_score:p50_1h
        expr: histogram_quantile(0.50, sum by (le) (rate(docflow_face_liveness_score_bucket[1h])))

      # ───── Registry confidence ─────
      - record: docflow:registry_confidence:p50_1h
        expr: histogram_quantile(0.50, sum by (le) (rate(docflow_registry_confidence_bucket[1h])))

      # ───── Risk score ─────
      - record: docflow:risk_score:p50_1h
        expr: histogram_quantile(0.50, sum by (le) (rate(docflow_risk_score_bucket[1h])))
      - record: docflow:risk_score:p95_1h
        expr: histogram_quantile(0.95, sum by (le) (rate(docflow_risk_score_bucket[1h])))

  - name: ai_decision_rates
    interval: 1m
    rules:
      # Auto-approve / manual / reject mix — the most demo-relevant
      # business KPI. A sudden swing here is the loudest signal that
      # something upstream changed.
      - record: docflow:pipeline_decisions:per_minute
        expr: sum by (decision) (rate(docflow_pipeline_decisions_total[5m]))

      - record: docflow:auto_approve_rate_1h
        expr: |
          sum(rate(docflow_pipeline_decisions_total{decision="auto_approve"}[1h]))
          /
          (sum(rate(docflow_pipeline_decisions_total[1h])) > 0)

      - record: docflow:manual_review_rate_1h
        expr: |
          sum(rate(docflow_pipeline_decisions_total{decision="manual_review"}[1h]))
          /
          (sum(rate(docflow_pipeline_decisions_total[1h])) > 0)

      - record: docflow:reject_rate_1h
        expr: |
          sum(rate(docflow_pipeline_decisions_total{decision="reject"}[1h]))
          /
          (sum(rate(docflow_pipeline_decisions_total[1h])) > 0)

      # OCR retake rate — proxy for input data quality. If this
      # spikes the citizen population is uploading worse photos
      # (worth investigating: did a phone-OS update reduce default
      # camera quality? did we tighten the threshold by accident?)
      - record: docflow:ocr_retake_rate_1h
        expr: |
          sum(rate(docflow_ocr_retake_required_total[1h]))
          /
          (sum(rate(docflow_ocr_requests_total[1h])) > 0)

  # ── PSI drift score ───────────────────────────────────────────
  # Population Stability Index over rolling-window distributions.
  # For each score-bearing histogram (risk_score, OCR confidence,
  # face similarity) we compute three band fractions over a 1h
  # current window and a 7d baseline window, then materialize the
  # per-band PSI term: (cur - base) * ln(cur / base). The dashboard
  # sums these terms across bands at query time to produce the
  # final PSI value.
  #
  # Interpretation (industry standard):
  #   PSI < 0.10  → stable (no action)
  #   PSI 0.10-0.25 → moderate shift (investigate)
  #   PSI > 0.25  → significant drift (intervene)
  #
  # ε floor: ln(0) is undefined and PSI rewards non-zero buckets,
  # so we clamp_min the fractions at 0.0001 so an empty band
  # contributes a finite (large) penalty instead of a NaN.
  - name: ai_drift_psi
    interval: 60s
    rules:
      # Risk-score: 3 bands matching the routing thresholds.
      - record: docflow:risk_psi_term:1h_vs_7d
        labels: { band: "auto_approve" }
        expr: |
          (
            clamp_min(histogram_fraction(0,  25,  sum by (le) (rate(docflow_risk_score_bucket[1h]))), 0.0001)
            -
            clamp_min(histogram_fraction(0,  25,  sum by (le) (rate(docflow_risk_score_bucket[7d]))), 0.0001)
          )
          *
          ln(
            clamp_min(histogram_fraction(0,  25,  sum by (le) (rate(docflow_risk_score_bucket[1h]))), 0.0001)
            /
            clamp_min(histogram_fraction(0,  25,  sum by (le) (rate(docflow_risk_score_bucket[7d]))), 0.0001)
          )
      - record: docflow:risk_psi_term:1h_vs_7d
        labels: { band: "manual_review" }
        expr: |
          (
            clamp_min(histogram_fraction(25, 60,  sum by (le) (rate(docflow_risk_score_bucket[1h]))), 0.0001)
            -
            clamp_min(histogram_fraction(25, 60,  sum by (le) (rate(docflow_risk_score_bucket[7d]))), 0.0001)
          )
          *
          ln(
            clamp_min(histogram_fraction(25, 60,  sum by (le) (rate(docflow_risk_score_bucket[1h]))), 0.0001)
            /
            clamp_min(histogram_fraction(25, 60,  sum by (le) (rate(docflow_risk_score_bucket[7d]))), 0.0001)
          )
      - record: docflow:risk_psi_term:1h_vs_7d
        labels: { band: "reject" }
        expr: |
          (
            clamp_min(histogram_fraction(60, 100, sum by (le) (rate(docflow_risk_score_bucket[1h]))), 0.0001)
            -
            clamp_min(histogram_fraction(60, 100, sum by (le) (rate(docflow_risk_score_bucket[7d]))), 0.0001)
          )
          *
          ln(
            clamp_min(histogram_fraction(60, 100, sum by (le) (rate(docflow_risk_score_bucket[1h]))), 0.0001)
            /
            clamp_min(histogram_fraction(60, 100, sum by (le) (rate(docflow_risk_score_bucket[7d]))), 0.0001)
          )

      # Face similarity: low / medium / high bands matching the
      # face-decision tiers in services/face/app/routers/liveness.py
      # (default thresholds: review<70 ≤ similarity < pass=90).
      - record: docflow:face_psi_term:1h_vs_7d
        labels: { band: "low" }
        expr: |
          (
            clamp_min(histogram_fraction(0,  70,  sum by (le) (rate(docflow_face_similarity_score_bucket[1h]))), 0.0001)
            -
            clamp_min(histogram_fraction(0,  70,  sum by (le) (rate(docflow_face_similarity_score_bucket[7d]))), 0.0001)
          )
          *
          ln(
            clamp_min(histogram_fraction(0,  70,  sum by (le) (rate(docflow_face_similarity_score_bucket[1h]))), 0.0001)
            /
            clamp_min(histogram_fraction(0,  70,  sum by (le) (rate(docflow_face_similarity_score_bucket[7d]))), 0.0001)
          )
      - record: docflow:face_psi_term:1h_vs_7d
        labels: { band: "medium" }
        expr: |
          (
            clamp_min(histogram_fraction(70, 90,  sum by (le) (rate(docflow_face_similarity_score_bucket[1h]))), 0.0001)
            -
            clamp_min(histogram_fraction(70, 90,  sum by (le) (rate(docflow_face_similarity_score_bucket[7d]))), 0.0001)
          )
          *
          ln(
            clamp_min(histogram_fraction(70, 90,  sum by (le) (rate(docflow_face_similarity_score_bucket[1h]))), 0.0001)
            /
            clamp_min(histogram_fraction(70, 90,  sum by (le) (rate(docflow_face_similarity_score_bucket[7d]))), 0.0001)
          )
      - record: docflow:face_psi_term:1h_vs_7d
        labels: { band: "high" }
        expr: |
          (
            clamp_min(histogram_fraction(90, 100, sum by (le) (rate(docflow_face_similarity_score_bucket[1h]))), 0.0001)
            -
            clamp_min(histogram_fraction(90, 100, sum by (le) (rate(docflow_face_similarity_score_bucket[7d]))), 0.0001)
          )
          *
          ln(
            clamp_min(histogram_fraction(90, 100, sum by (le) (rate(docflow_face_similarity_score_bucket[1h]))), 0.0001)
            /
            clamp_min(histogram_fraction(90, 100, sum by (le) (rate(docflow_face_similarity_score_bucket[7d]))), 0.0001)
          )

      # OCR confidence: bins by quality (poor / ok / good).
      - record: docflow:ocr_psi_term:1h_vs_7d
        labels: { band: "poor" }
        expr: |
          (
            clamp_min(histogram_fraction(0,    0.5,  sum by (le) (rate(docflow_ocr_confidence_bucket[1h]))), 0.0001)
            -
            clamp_min(histogram_fraction(0,    0.5,  sum by (le) (rate(docflow_ocr_confidence_bucket[7d]))), 0.0001)
          )
          *
          ln(
            clamp_min(histogram_fraction(0,    0.5,  sum by (le) (rate(docflow_ocr_confidence_bucket[1h]))), 0.0001)
            /
            clamp_min(histogram_fraction(0,    0.5,  sum by (le) (rate(docflow_ocr_confidence_bucket[7d]))), 0.0001)
          )
      - record: docflow:ocr_psi_term:1h_vs_7d
        labels: { band: "ok" }
        expr: |
          (
            clamp_min(histogram_fraction(0.5,  0.85, sum by (le) (rate(docflow_ocr_confidence_bucket[1h]))), 0.0001)
            -
            clamp_min(histogram_fraction(0.5,  0.85, sum by (le) (rate(docflow_ocr_confidence_bucket[7d]))), 0.0001)
          )
          *
          ln(
            clamp_min(histogram_fraction(0.5,  0.85, sum by (le) (rate(docflow_ocr_confidence_bucket[1h]))), 0.0001)
            /
            clamp_min(histogram_fraction(0.5,  0.85, sum by (le) (rate(docflow_ocr_confidence_bucket[7d]))), 0.0001)
          )
      - record: docflow:ocr_psi_term:1h_vs_7d
        labels: { band: "good" }
        expr: |
          (
            clamp_min(histogram_fraction(0.85, 1.0,  sum by (le) (rate(docflow_ocr_confidence_bucket[1h]))), 0.0001)
            -
            clamp_min(histogram_fraction(0.85, 1.0,  sum by (le) (rate(docflow_ocr_confidence_bucket[7d]))), 0.0001)
          )
          *
          ln(
            clamp_min(histogram_fraction(0.85, 1.0,  sum by (le) (rate(docflow_ocr_confidence_bucket[1h]))), 0.0001)
            /
            clamp_min(histogram_fraction(0.85, 1.0,  sum by (le) (rate(docflow_ocr_confidence_bucket[7d]))), 0.0001)
          )

      # Final aggregated PSI per metric — dashboard reads these.
      - record: docflow:risk_psi:1h_vs_7d
        expr: sum(docflow:risk_psi_term:1h_vs_7d)
      - record: docflow:face_psi:1h_vs_7d
        expr: sum(docflow:face_psi_term:1h_vs_7d)
      - record: docflow:ocr_psi:1h_vs_7d
        expr: sum(docflow:ocr_psi_term:1h_vs_7d)
