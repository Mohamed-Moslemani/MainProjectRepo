global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager wiring — without this block, fired alerts only show
# up in /alerts and never reach Slack/PagerDuty. Resolution is the
# Docker network DNS name of the compose service.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/drift_alerts.yml

scrape_configs:
  # Application services
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          service: gateway

  - job_name: "ocr"
    metrics_path: /metrics
    static_configs:
      - targets: ["ocr:8001"]
        labels:
          service: ocr

  - job_name: "face"
    metrics_path: /metrics
    static_configs:
      - targets: ["face:8002"]
        labels:
          service: face

  - job_name: "registry"
    metrics_path: /metrics
    static_configs:
      - targets: ["registry:8003"]
        labels:
          service: registry

  # Infrastructure
  - job_name: "postgresql"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Pushgateway — short-lived jobs (continuous eval, daily sweeps)
  # push metrics here. honor_labels keeps the job= label set by the
  # pusher rather than overwriting it with "pushgateway".
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]