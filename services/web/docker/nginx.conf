server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed responses for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Hashed assets produced by Vite (filename-hash.ext) are immutable.
    # Cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any unknown path falls through to index.html so
    # React Router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html itself; bundle hashes change on every deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
